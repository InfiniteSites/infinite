<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Infinite Unlocker</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.json">

<script src="utils.js"></script>
<script src="int64.js"></script>
<script src="stages.js"></script>
<script src="offsets.js"></script>
<script src="pwn.js"></script>

<style>

body{
margin:0;
font-family:-apple-system, Helvetica;
background:linear-gradient(180deg,#ff8a00,#ff5e00);
height:100vh;
display:flex;
align-items:center;
justify-content:center;
color:white;
overflow:hidden;
}

.container{
text-align:center;
animation:fadeIn 1.5s ease;
}

.title{
font-size:34px;
font-weight:700;
margin-bottom:10px;
}

.subtitle{
font-size:16px;
opacity:0.8;
margin-bottom:70px;
}

.circle{

width:240px;
height:240px;

border-radius:50%;

background:white;

color:#ff6a00;

display:flex;
align-items:center;
justify-content:center;

font-size:30px;
font-weight:700;

cursor:pointer;

margin:auto;

box-shadow:
0 0 40px rgba(255,255,255,0.7),
0 0 80px rgba(255,255,255,0.4);

transition:all .3s ease;

}

.circle:active{
transform:scale(.95);
}

.progress{
margin-top:30px;
font-size:20px;
opacity:.9;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}

.footer{
position:absolute;
bottom:20px;
font-size:13px;
opacity:0.7;
}

</style>

<script>

function log(msg){
console.log(msg);
}

var running=false;

function jailbreak(){

if(running) return;
running=true;

var btn=document.getElementById("circle");
var prog=document.getElementById("progress");

btn.innerHTML="Running";

/* start exploit (same delay as original page) */

setTimeout(function(){
try{
pwn();
}catch(e){
console.log(e);
}
},100);

/* fake progress */

prog.innerHTML="1/3";

setTimeout(function(){
prog.innerHTML="2/3";
},8000);

setTimeout(function(){
prog.innerHTML="3/3";
},16000);

setTimeout(function(){
btn.innerHTML="Jailbroken";
prog.innerHTML="";
},23000);

}

</script>

</head>

<body>

<div class="container">

<div class="title">Infinite Unlocker</div>
<div class="subtitle">iOS 12 – 12.5.8</div>

<div id="circle" class="circle" onclick="jailbreak()">
Jailbreak
</div>

<div id="progress" class="progress"></div>

</div>

<div class="footer">
Forked off tns v2
</div>

</body>
</html>
